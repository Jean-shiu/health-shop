<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU58 商品介紹</title>
<style>
  :root{--ink:#2c3a33;--gold:#c9a44c;--gold-d:#a5822f;--green:#1f4536;--green2:#2e6b52;--line:#e6d9bf;}
  *{box-sizing:border-box;}
  body{margin:0;color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
    background:linear-gradient(160deg,#f6efe1 0%,#efe4cf 55%,#e9dcc2 100%);
    background-attachment:fixed;line-height:1.6;min-height:100vh;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:#fff;border:1px solid var(--line);color:var(--green);
    padding:8px 16px;border-radius:999px;font-size:.9rem;font-weight:600;transition:.2s;}
  .back:hover{background:var(--green);color:#f4e9c8;border-color:var(--green);}
  header.hero{text-align:center;margin:10px 0 24px;}
  header.hero h1{color:var(--green);font-size:clamp(1.4rem,4vw,2rem);margin:0 0 4px;letter-spacing:.04em;}
  header.hero .sub{color:#7a6a48;font-size:.95rem;}
  .price-tag{display:inline-block;margin-top:12px;padding:8px 22px;border-radius:999px;
    background:linear-gradient(135deg,var(--green),var(--green2));color:#f4e9c8;font-weight:700;
    letter-spacing:.05em;box-shadow:0 6px 18px rgba(31,69,54,.25);border:1px solid rgba(201,164,76,.6);}
  .imgcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;
    box-shadow:0 8px 24px rgba(120,100,60,.12);overflow:hidden;}
  .imgcard img{width:100%;height:auto;display:block;border-radius:10px;}
  .note{text-align:center;color:#9a8b6a;font-size:.82rem;margin-top:20px;letter-spacing:.05em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="index.html">← 返回目錄</a></div>
  <header class="hero">
    <h1>Microbiome Labs HU58</h1>
    <div class="sub">高效孢子益生菌（60粒膠囊）· 美國功能醫學診所專用</div>
    <div class="price-tag">委任價 2250 元</div>
  </header>
  <div class="imgcard">
    <img src="img/hu58-intro.jpg" alt="HU58 功能與好處">
  </div>
  <p class="note">※ 以上內容僅供商品成分說明參考，數量與價格如有異動以實際洽詢為準。</p>
</div>
</body>
</html>
